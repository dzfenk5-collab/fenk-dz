name: Deploy FENK from ZIP

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fenk-deploy
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          rm -rf _fenk_extract
          mkdir -p _fenk_extract

          unzip -q "$ZIP_FILE" -d _fenk_extract

          INDEX_FILE="$(find _fenk_extract -type f -iname 'index.html' | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside the ZIP."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$INDEX_FILE")"
          echo "Project root: $PROJECT_ROOT"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_fenk_extract' \
            ! -name '*.zip' \
            -exec rm -rf {} +

          cp -a "$PROJECT_ROOT"/. .

          rm -rf _fenk_extract
          find . -type f -iname '*.zip' -delete

      - name: Verify project
        shell: bash
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html is not in the repository root."
            exit 1
          fi

          echo "FENK project is ready."

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Deploy FENK from uploaded ZIP"
          git push
